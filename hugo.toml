baseURL = 'https://avvlacogullada.org/'
title = 'AVV La Cogullada'

pagerSize = 5

defaultContentLanguage = 'ca'
disableDefaultLanguageRedirect = true

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = ""
author = ""
favicon = ""
site_logo = "logo_rodo_peque.jpg"
description = "Associació de veïns i veïnes de la Cogullada."
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-dark-blue"
recent_posts_number = 5
# custom_css = ["custom.css"]

[params.ananke.social.follow]
new_window_icon = false
networks = [
  "instagram"
]
[params.ananke.social.instagram]
username = "avvlacogullada"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[module]
[[module.imports]]
disable = false
ignoreConfig = false
ignoreImports = false
path = 'github.com/gohugo-ananke/ananke/v2'

[languages]
[languages.es]
weight = 1
label = "Español"

[languages.ca]
weight = 0
label = "Català"
title = "AVV La Cogullada"
locale = "ca-ES"
